<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Symptom Scanner</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        #app-container { 
            position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; 
            justify-content: space-between; background-color: #0a0a0a; 
        }
        
        /* Camera Container */
        #vision-container { 
            position: relative; width: 90vw; max-width: 350px; aspect-ratio: 1 / 1; 
            margin: auto; border-radius: 16px; background: #111; overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); border: 2px solid #333; 
        }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 10; pointer-events: none; }
        
        /* Interactive Info Panel */
        #info-panel { 
            height: 45%; background: #1e1e24; z-index: 20; border-top-left-radius: 24px; 
            border-top-right-radius: 24px; box-shadow: 0 -4px 20px rgba(0,0,0,0.6); 
            padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; 
            overflow-y: auto; /* Allows scrolling if results are long */
        }

        /* State Panels (Hidden by default) */
        .panel-state { display: none; flex-direction: column; height: 100%; justify-content: center; align-items: center; text-align: center; }
        .active-state { display: flex; }

        /* Typography & Buttons */
        h2 { margin: 0 0 10px 0; font-size: 1.8rem; color: #4CAF50; }
        p { margin: 0 0 15px 0; font-size: 1.05rem; line-height: 1.5; color: #d1d1d1; }
        
        .primary-btn {
            background-color: #007bff; color: white; border: none; padding: 15px 30px; 
            font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4); transition: transform 0.1s;
            width: 100%; max-width: 300px; margin-top: 10px;
        }
        .primary-btn:active { transform: scale(0.96); }
        .primary-btn:disabled { background-color: #555; cursor: not-allowed; box-shadow: none; }

        #timer-text { font-size: 3rem; font-weight: bold; color: #ff9800; margin: 10px 0; }
        
        /* Results Styling */
        #results-list { width: 100%; text-align: left; margin-bottom: 20px; }
        .result-item { background: #2a2a35; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 5px solid #f44336; }
        .result-title { color: #f44336; font-size: 1.3rem; margin: 0 0 5px 0; font-weight: bold; }
        .result-def { font-size: 0.95rem; color: #ddd; margin: 0 0 8px 0; }
        .result-rec { font-size: 0.95rem; color: #4CAF50; margin: 0; font-weight: bold; }
        .all-clear { color: #4CAF50 !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="vision-container">
        <video id="camera-feed" autoplay playsinline muted></video>
        <canvas id="overlay-canvas"></canvas>
    </div>

    <div id="info-panel">
        
        <div id="state-init" class="panel-state active-state">
            <h2 style="color: #ff9800;">Please Wait</h2>
            <p>Loading AI Engine...</p>
        </div>

        <div id="state-idle" class="panel-state">
            <h2>Ready to Scan</h2>
            <p>Position the camera clearly over the area of concern. The scan will take 5 seconds.</p>
            <button id="btn-start" class="primary-btn" onclick="startScreening()">Begin Screening</button>
        </div>

        <div id="state-scanning" class="panel-state">
            <h2 style="color: #ff9800;">Scanning...</h2>
            <p>Keep the camera steady.</p>
            <div id="timer-text">5</div>
        </div>

        <div id="state-results" class="panel-state" style="justify-content: flex-start;">
            <h2 id="results-header">Screening Complete</h2>
            <div id="results-list">
                </div>
            <button class="primary-btn" onclick="resetToIdle()" style="background-color: #333;">Start New Scan</button>
        </div>

    </div>
</div>

<script>
    var Module = { onRuntimeInitialized: function() { window.wasmReady = true; } };
</script>
<script src="edge-impulse-standalone.js"></script>
<script src="run-impulse.js"></script>

<script>
    // --- 1. EXPANDED DICTIONARY (With Recommendations) ---
    const symptomDictionary = {
        "Crack": { 
            title: "Crack Detected", 
            definition: "A structural discontinuity indicating severe material stress.",
            recommendation: "Immediate stabilization is recommended. Avoid applying pressure."
        },
        "Thick Fur": { 
            title: "Thick Fur Detected", 
            definition: "Dense hair accumulation noted in the scanned area.",
            recommendation: "Ensure area is clean. May require trimming for better visibility of underlying skin."
        },
        "Tooth Mark": { 
            title: "Tooth Mark Detected", 
            definition: "Surface indentation or puncture consistent with a bite.",
            recommendation: "Clean area with antiseptic. Monitor closely for signs of infection."
        },
        "Ecchymosis": { 
            title: "Ecchymosis Detected", 
            definition: "Irregular pigmentation indicating potential bruising or pooling of blood.",
            recommendation: "Apply a cold compress to reduce swelling. Rest the affected area."
        }
    };

    // --- 2. APP STATE VARIABLES ---
    let currentAppState = 'INIT'; // INIT, IDLE, SCANNING, RESULTS
    let recordedSymptoms = new Set(); // Stores all unique symptoms found during the 5 seconds
    
    // Smoothing / Debounce variables
    const DEBOUNCE_FRAMES = 5; 
    let currentCandidate = null;
    let consecutiveCount = 0;

    // DOM Elements
    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');
    
    // UI Panels
    const panelInit = document.getElementById('state-init');
    const panelIdle = document.getElementById('state-idle');
    const panelScanning = document.getElementById('state-scanning');
    const panelResults = document.getElementById('state-results');
    const timerText = document.getElementById('timer-text');
    const resultsList = document.getElementById('results-list');
    const resultsHeader = document.getElementById('results-header');

    // Edge Impulse Variables
    let classifier = null, modelProps = null;
    const offscreenCanvas = document.createElement('canvas');
    const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

    // --- 3. UI STATE MANAGEMENT ---
    function switchState(newState) {
        currentAppState = newState;
        document.querySelectorAll('.panel-state').forEach(p => p.classList.remove('active-state'));
        
        if(newState === 'INIT') panelInit.classList.add('active-state');
        if(newState === 'IDLE') panelIdle.classList.add('active-state');
        if(newState === 'SCANNING') panelScanning.classList.add('active-state');
        if(newState === 'RESULTS') panelResults.classList.add('active-state');
        
        // Clear canvas if we aren't scanning
        if(newState !== 'SCANNING') ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function resetToIdle() {
        recordedSymptoms.clear(); // Clear previous results
        switchState('IDLE');
    }

    // --- 4. THE 5-SECOND SCREENING LOGIC ---
    function startScreening() {
        switchState('SCANNING');
        recordedSymptoms.clear();
        currentCandidate = null;
        consecutiveCount = 0;
        
        let timeLeft = 5;
        timerText.innerText = timeLeft;

        let countdown = setInterval(() => {
            timeLeft--;
            timerText.innerText = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                finishScreening();
            }
        }, 1000);
    }

    function finishScreening() {
        switchState('RESULTS');
        resultsList.innerHTML = ''; // Clear old HTML

        if (recordedSymptoms.size === 0) {
            // No symptoms found
            resultsHeader.innerText = "No Anomalies Detected";
            resultsHeader.className = "all-clear";
            resultsList.innerHTML = `<p style="text-align:center;">The AI did not detect any concerning markers during the 5-second scan.</p>`;
        } else {
            // Symptoms found! Generate the report list
            resultsHeader.innerText = "Anomalies Identified";
            resultsHeader.className = "";
            
            recordedSymptoms.forEach(symptomKey => {
                const data = symptomDictionary[symptomKey];
                if(data) {
                    const html = `
                        <div class="result-item">
                            <h3 class="result-title">${data.title}</h3>
                            <p class="result-def">${data.definition}</p>
                            <p class="result-rec">Rec: ${data.recommendation}</p>
                        </div>
                    `;
                    resultsList.innerHTML += html;
                }
            });
        }
    }

    // --- 5. AI INITIALIZATION & CAMERA ---
    async function initAI() {
        try {
            classifier = new EdgeImpulseClassifier();
            if (window.wasmReady && !classifier._initialized) {
                if(Module.init) Module.init();
                classifier._initialized = true;
            } else {
                await classifier.init();
            }
            modelProps = classifier.getProperties();
            offscreenCanvas.width = modelProps.input_width;
            offscreenCanvas.height = modelProps.input_height;
            initCamera();
        } catch (err) {
            console.error("AI Load Error:", err);
            panelInit.innerHTML = `<h2 style="color:red;">Error</h2><p>${err}</p>`;
        }
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                resizeCanvas();
                switchState('IDLE'); // System is fully ready!
                requestAnimationFrame(inferenceLoop);
            };
        } catch (error) {
            panelInit.innerHTML = `<h2 style="color:red;">Camera Denied</h2><p>Please grant camera permissions.</p>`;
        }
    }

    function resizeCanvas() {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    // --- 6. INFERENCE & DRAWING (Only processes during SCANNING state) ---
    function inferenceLoop() {
        if (!classifier || !modelProps) return requestAnimationFrame(inferenceLoop);

        // ALWAYS grab frames so the camera doesn't freeze, but only process if SCANNING
        if (currentAppState === 'SCANNING') {
            const minVid = Math.min(video.videoWidth, video.videoHeight);
            const sx = (video.videoWidth - minVid) / 2;
            const sy = (video.videoHeight - minVid) / 2;
            offscreenCtx.drawImage(video, sx, sy, minVid, minVid, 0, 0, modelProps.input_width, modelProps.input_height);
            
            const imgData = offscreenCtx.getImageData(0, 0, modelProps.input_width, modelProps.input_height);
            let features = [];
            for (let i = 0; i < imgData.data.length; i += 4) {
                features.push((imgData.data[i] << 16) | (imgData.data[i+1] << 8) | imgData.data[i+2]);
            }

            try {
                const res = classifier.classify(features);
                let topResult = null;
                
                if (res.results && res.results.length > 0) {
                    topResult = res.results.reduce((prev, current) => (prev.value > current.value) ? prev : current);
                    if (topResult.value < 0.6) topResult = null;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (topResult) { 
                    // Draw the green box
                    const scaleX = canvas.width / modelProps.input_width, scaleY = canvas.height / modelProps.input_height;
                    const scaledX = topResult.x * scaleX, scaledY = topResult.y * scaleY;
                    const scaledWidth = topResult.width * scaleX, scaledHeight = topResult.height * scaleY;

                    ctx.strokeStyle = '#00FF00'; ctx.lineWidth = 4;
                    ctx.strokeRect(scaledX, scaledY, scaledWidth, scaledHeight);
                    ctx.fillStyle = '#00FF00'; ctx.font = 'bold 24px Arial';
                    ctx.fillText(topResult.label, scaledX, scaledY - 10);

                    // Debounce Logic: Only log it if it stays for 5 frames
                    if (topResult.label === currentCandidate) { 
                        consecutiveCount++; 
                    } else { 
                        currentCandidate = topResult.label; 
                        consecutiveCount = 1; 
                    }

                    if (consecutiveCount >= DEBOUNCE_FRAMES) {
                        recordedSymptoms.add(topResult.label); // Successfully logged for the final report!
                    }
                } else {
                    currentCandidate = null;
                    consecutiveCount = 0;
                }
            } catch (e) {
                if (Math.random() < 0.01) console.error(e);
            }
        }

        requestAnimationFrame(inferenceLoop);
    }

    setTimeout(initAI, 1000);

</script>
</body>
</html>
