<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Symptom Scanner</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        #app-container { 
            position: relative; width: 100vw; 
            height: 100vh; height: 100dvh; 
            display: flex; flex-direction: column; 
            justify-content: space-between; background-color: #0a0a0a; 
        }
        
        #vision-container { 
            position: relative; width: 90vw; max-width: 350px; aspect-ratio: 1 / 1; 
            margin: auto; border-radius: 16px; background: #111; overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); border: 2px solid #333; 
        }
        
        /* Added transform-origin to ensure zooming stays perfectly centered */
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: center center; }
        canvas { z-index: 10; pointer-events: none; }
        
        #vision-snapshot {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: contain; z-index: 20; display: none; background: #000;
        }

        /* NEW: Zoom Slider UI */
        #zoom-controls {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            z-index: 25; display: none; align-items: center; gap: 10px;
            background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px;
        }
        #zoom-slider { width: 120px; accent-color: #4CAF50; }

        #info-panel { 
            height: 48%; background: #1e1e24; z-index: 30; border-top-left-radius: 24px; 
            border-top-right-radius: 24px; box-shadow: 0 -4px 20px rgba(0,0,0,0.6); 
            padding: 20px 24px 30px 24px; box-sizing: border-box; display: flex; flex-direction: column; 
        }

        .panel-state { display: none; flex-direction: column; height: 100%; justify-content: center; align-items: center; text-align: center; }
        .active-state { display: flex; }

        h2 { margin: 0 0 10px 0; font-size: 1.8rem; color: #4CAF50; flex-shrink: 0; }
        p { margin: 0 0 15px 0; font-size: 1.05rem; line-height: 1.5; color: #d1d1d1; flex-shrink: 0; }
        
        .primary-btn {
            background-color: #007bff; color: white; border: none; padding: 15px 30px; 
            font-size: 1.15rem; font-weight: bold; border-radius: 30px; cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4); transition: transform 0.1s;
            width: 100%; max-width: 300px; margin: 6px auto; flex-shrink: 0; 
        }
        .primary-btn:active { transform: scale(0.96); }

        #scan-status { font-size: 1.4rem; font-weight: bold; color: #ff9800; margin: 10px 0; min-height: 30px; }
        
        .dev-toggle-container { margin-top: 15px; font-size: 0.9rem; color: #888; display: flex; align-items: center; gap: 8px; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        
        #dev-controls { display: none; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; width: 100%; }
        .dev-btn { background: #00bcd4; color: #000; border: none; padding: 8px 12px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
        
        .action-buttons { display: flex; flex-direction: column; width: 100%; align-items: center; margin-bottom: 5px; }

        #results-list { width: 100%; text-align: left; margin-bottom: 5px; flex-grow: 1; overflow-y: auto; padding-right: 5px; display: none; }
        #results-list::-webkit-scrollbar { width: 6px; }
        #results-list::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }

        .result-item { background: #2a2a35; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 5px solid #f44336; }
        .result-title { color: #f44336; font-size: 1.3rem; margin: 0 0 5px 0; font-weight: bold; }
        .result-def { font-size: 0.95rem; color: #ddd; margin: 0 0 8px 0; }
        .result-rec { font-size: 0.95rem; color: #4CAF50; margin: 0; font-weight: bold; }
        .all-clear { color: #4CAF50 !important; }
        
        #scan-id-display { font-size: 0.9rem; color: #aaa; margin-bottom: 10px; font-family: monospace; }
        
        .btn-row { display: flex; gap: 10px; width: 100%; max-width: 300px; margin-top: 10px; }
        .btn-row .primary-btn { margin-top: 0; padding: 15px 10px; font-size: 1.1rem; }
        .db-btn { font-size: 1rem; padding: 10px 15px; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="vision-container">
        <video id="camera-feed" autoplay playsinline muted></video>
        <canvas id="overlay-canvas"></canvas>
        <img id="vision-snapshot" />
        
        <div id="zoom-controls">
            <span style="font-size: 1.2rem;">🔍</span>
            <input type="range" id="zoom-slider" min="1" max="3" step="0.1" value="1" oninput="updateZoom(this.value)">
        </div>
    </div>

    <div id="info-panel">
        
        <div id="state-init" class="panel-state active-state">
            <h2 style="color: #ff9800;">Please Wait</h2>
            <p>Loading AI Engine...</p>
        </div>

        <div id="state-idle" class="panel-state">
            <h2>Ready to Scan</h2>
            <p style="margin-bottom: 5px;">Choose an input method below.</p>
            
            <button class="primary-btn" onclick="startScreening()">📸 Live Camera Scan</button>
            <button class="primary-btn" onclick="document.getElementById('file-upload').click()" style="background-color: #9c27b0; box-shadow: 0 4px 15px rgba(156, 39, 176, 0.4);">📂 Upload Image</button>
            <input type="file" id="file-upload" accept="image/*" style="display: none;">
            
            <div class="btn-row" style="margin-top: 5px;">
                <button class="primary-btn db-btn" onclick="downloadExcelLog()" style="background-color: #2e7d32; box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4); flex: 2;">📊 Download Excel Log</button>
                <button class="primary-btn db-btn" onclick="clearLogMemory()" style="background-color: #d32f2f; box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4); flex: 1; padding: 10px 5px;">🗑️ Clear</button>
            </div>
            
            <label class="dev-toggle-container">
                <input type="checkbox" id="dev-toggle"> ⚙️ Enable Developer Mode
            </label>
        </div>

        <div id="state-scanning" class="panel-state">
            <h2 style="color: #ff9800;">Scanning Active</h2>
            <div id="scan-id-display"></div>
            <p>Analyzing surface data...</p>
            <div id="scan-status">Looking for symptoms...</div>

            <div id="dev-controls">
                <button class="dev-btn" onclick="injectMockSymptom('Crack')">+ Crack</button>
                <button class="dev-btn" onclick="injectMockSymptom('Thick Fur')">+ Fur</button>
                <button class="dev-btn" onclick="injectMockSymptom('Tooth Mark')">+ Bite</button>
                <button class="dev-btn" onclick="injectMockSymptom('Ecchymosis')">+ Bruise</button>
            </div>
        </div>

        <div id="state-results" class="panel-state" style="justify-content: flex-start; width: 100%;">
            <h2 id="results-header">Screening Complete</h2>
            <div id="result-id-display" style="font-family: monospace; color: #888; margin-bottom: 10px;"></div>
            
            <div class="action-buttons" id="action-buttons-container">
                <button id="btn-view-report" class="primary-btn" onclick="showReport()" style="background-color: #ff9800; box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);">📄 View Symptom Report</button>
                <button id="btn-save-image" class="primary-btn" onclick="downloadSnapshot()" style="background-color: #4CAF50; box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);">💾 Save Image & Log Result</button>
                <button id="btn-discard" class="primary-btn" onclick="resetToIdle()" style="background-color: #333; box-shadow: 0 4px 15px rgba(51, 51, 51, 0.4);">Discard & Scan Again</button>
            </div>

            <div id="results-list"></div>
        </div>

    </div>
</div>

<script>
    var Module = { onRuntimeInitialized: function() { window.wasmReady = true; } };
</script>
<script src="edge-impulse-standalone.js"></script>
<script src="run-impulse.js"></script>

<script>
    // --- 1. DICTIONARY ---
     const symptomDictionary = {
        "Crack": { 
            title: "Fissure / Crack Detected", 
            definition: "Visible fissures or deep grooves on the tongue's mucosal surface. Clinical literature associates this with metabolic heat or fluid depletion.",
            recommendation: "Anomaly flagged. Please consult a healthcare professional or TCM practitioner for a clinical evaluation."
        },
        "Thick Fur": { 
            title: "Thick Fur (Coating) Detected", 
            definition: "A heavy, dense white or yellowish microbial coating on the tongue. Frequently associated in clinical literature with metabolic syndrome or digestive distress.",
            recommendation: "Anomaly flagged. Please consult a healthcare professional or TCM practitioner for a clinical evaluation."
        },
        "Tooth Mark": { 
            title: "Toothmark (Scalloped Edge) Detected", 
            definition: "Wavy indentations along the lateral borders of the tongue, typically caused by tongue swelling pressing against the teeth over time.",
            recommendation: "Anomaly flagged. Please consult a healthcare professional or TCM practitioner for a clinical evaluation."
        },
        "Ecchymosis": { 
            title: "Ecchymosis Detected", 
            definition: "Dark red or purplish discolored patches on the tongue indicating potential microvascular blood stasis or poor circulation.",
            recommendation: "Anomaly flagged. Please consult a healthcare professional or TCM practitioner for a clinical evaluation."
        }
    };

    // --- 2. DYNAMIC APP STATE & DATABASES ---
    let currentAppState = 'INIT'; 
    let recordedSymptoms = new Set(); 
    let symptomFrames = {};           
    let lastSnapshotURL = null; 
    let isLiveScanning = false; 
    
    // NEW: Zoom Variable
    let currentZoom = 1.0;
    
    let inactivityTimer = null;
    let secondsSinceLastFind = 0;
    const AUTO_STOP_SECONDS = 4;      
    const CONFIRMATION_FRAMES = 10;   

    let currentScanID = "";
    let sessionHistory = JSON.parse(localStorage.getItem('medicalScanLog')) || []; 

    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');
    const visionSnapshot = document.getElementById('vision-snapshot');
    const zoomControls = document.getElementById('zoom-controls');
    const zoomSlider = document.getElementById('zoom-slider');
    
    const panelInit = document.getElementById('state-init');
    const panelIdle = document.getElementById('state-idle');
    const panelScanning = document.getElementById('state-scanning');
    const panelResults = document.getElementById('state-results');
    const scanStatus = document.getElementById('scan-status');
    const resultsList = document.getElementById('results-list');
    const resultsHeader = document.getElementById('results-header');
    
    const devToggle = document.getElementById('dev-toggle');
    const devControls = document.getElementById('dev-controls');

    let classifier = null, modelProps = null;
    const offscreenCanvas = document.createElement('canvas');
    const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

    // --- 3. STATE MANAGEMENT ---
    function switchState(newState) {
        currentAppState = newState;
        document.querySelectorAll('.panel-state').forEach(p => p.classList.remove('active-state'));
        
        if(newState === 'INIT') panelInit.classList.add('active-state');
        if(newState === 'IDLE') panelIdle.classList.add('active-state');
        if(newState === 'SCANNING') panelScanning.classList.add('active-state');
        if(newState === 'RESULTS') panelResults.classList.add('active-state');
        
        if(newState !== 'SCANNING') {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            isLiveScanning = false; 
        }

        // Show zoom slider only during IDLE or SCANNING
        if (newState === 'IDLE' || newState === 'SCANNING') {
            zoomControls.style.display = 'flex';
        } else {
            zoomControls.style.display = 'none';
        }

        if (newState === 'RESULTS' && lastSnapshotURL) {
            visionSnapshot.src = lastSnapshotURL;
            visionSnapshot.style.display = 'block';
        } else {
            visionSnapshot.style.display = 'none';
        }
    }

    function resetToIdle() {
        switchState('IDLE');
        document.getElementById('file-upload').value = ''; 
        // Automatically zoom back out when returning to IDLE
        zoomSlider.value = 1.0;
        updateZoom(1.0);
    }

    // NEW FUNCTION: Handle the Zoom Slider
    function updateZoom(val) {
        currentZoom = parseFloat(val);
        // Visually scale up the camera and canvas
        video.style.transform = `scale(${currentZoom})`;
        canvas.style.transform = `scale(${currentZoom})`;
    }

    // --- 4. SMART SCREENING LOGIC ---
    function startScreening() {
        switchState('SCANNING');
        isLiveScanning = true;
        recordedSymptoms.clear();
        symptomFrames = {}; 
        lastSnapshotURL = null; 
        secondsSinceLastFind = 0;
        
        currentScanID = "LIVE-" + Math.random().toString(36).substr(2, 5).toUpperCase();
        document.getElementById('scan-id-display').innerText = `ID: ${currentScanID}`;
        scanStatus.innerText = "Looking for anomalies...";
        scanStatus.style.color = "#ff9800";

        if (devToggle.checked) devControls.style.display = 'flex';
        else devControls.style.display = 'none';

        inactivityTimer = setInterval(() => {
            secondsSinceLastFind++;
            if (secondsSinceLastFind >= AUTO_STOP_SECONDS) {
                clearInterval(inactivityTimer);
                finishScreening();
            }
        }, 1000);
    }

    function injectMockSymptom(label) {
        if (currentAppState !== 'SCANNING') return;
        if (!recordedSymptoms.has(label)) {
            recordedSymptoms.add(label);
            captureSnapshot(); 
            secondsSinceLastFind = 0; 
            scanStatus.innerText = `[DEV MOCK] Logged: ${label}`;
            scanStatus.style.color = "#00bcd4"; 
        }
    }

    document.getElementById('file-upload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        switchState('SCANNING');
        zoomControls.style.display = 'none'; // Hide zoom slider during static upload process
        scanStatus.innerText = "Analyzing uploaded image...";
        currentScanID = "UPLD-" + Math.random().toString(36).substr(2, 5).toUpperCase();
        document.getElementById('scan-id-display').innerText = `ID: ${currentScanID}`;
        devControls.style.display = 'none';

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() { processUploadedImage(img); }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    function processUploadedImage(img) {
        recordedSymptoms.clear();
        offscreenCtx.clearRect(0, 0, offscreenCanvas.width, offscreenCanvas.height);
        const minDim = Math.min(img.width, img.height);
        const sx = (img.width - minDim) / 2;
        const sy = (img.height - minDim) / 2;
        offscreenCtx.drawImage(img, sx, sy, minDim, minDim, 0, 0, modelProps.input_width, modelProps.input_height);

        const imgData = offscreenCtx.getImageData(0, 0, modelProps.input_width, modelProps.input_height);
        let features = [];
        for (let i = 0; i < imgData.data.length; i += 4) features.push((imgData.data[i] << 16) | (imgData.data[i+1] << 8) | imgData.data[i+2]);

        try {
            const res = classifier.classify(features);
            
            // Standardize uploaded images to a clean 600x600 square exactly like the UI
            const snapCanvas = document.createElement('canvas');
            snapCanvas.width = 600; snapCanvas.height = 600;
            const snapCtx = snapCanvas.getContext('2d');
            snapCtx.drawImage(img, sx, sy, minDim, minDim, 0, 0, 600, 600);

            if (res.results && res.results.length > 0) {
                const topResult = res.results.reduce((prev, current) => (prev.value > current.value) ? prev : current);
                if (topResult.value >= 0.5) {
                    recordedSymptoms.add(topResult.label);
                    
                    const scaleX = 600 / modelProps.input_width;
                    const scaleY = 600 / modelProps.input_height;
                    const scaledX = topResult.x * scaleX; const scaledY = topResult.y * scaleY;

                    snapCtx.strokeStyle = '#00FF00'; snapCtx.lineWidth = 6;
                    snapCtx.strokeRect(scaledX, scaledY, topResult.width * scaleX, topResult.height * scaleY);
                    snapCtx.fillStyle = '#00FF00'; snapCtx.font = 'bold 28px Arial';
                    snapCtx.fillText(topResult.label, scaledX, scaledY - 10);
                }
            }
            lastSnapshotURL = snapCanvas.toDataURL('image/jpeg', 0.9);
            finishScreening(); 
        } catch (e) {
            alert("Error processing image.");
            resetToIdle();
        }
    }

    function finishScreening() {
        switchState('RESULTS'); 
        document.getElementById('result-id-display').innerText = `Record ID: ${currentScanID}`;
        resultsList.innerHTML = ''; 
        resultsList.style.display = 'none'; 
        
        const btnView = document.getElementById('btn-view-report');
        const btnSave = document.getElementById('btn-save-image');
        const btnDiscard = document.getElementById('btn-discard');

        if (recordedSymptoms.size === 0) {
            resultsHeader.innerText = "No Anomalies Detected";
            resultsHeader.className = "all-clear";
            resultsHeader.style.color = "#4CAF50";
            resultsList.innerHTML = `<p style="text-align:center;">The AI did not detect any concerning markers.</p>`;
            resultsList.style.display = 'block'; 
            btnView.style.display = 'none';
            btnSave.style.display = 'none';
            btnDiscard.innerText = "Start New Scan";
        } else {
            resultsHeader.innerText = "Anomalies Identified";
            resultsHeader.className = "";
            resultsHeader.style.color = "#f44336";
            btnView.style.display = 'block';
            btnSave.style.display = 'block';
            btnDiscard.innerText = "Discard & Scan Again";
            
            recordedSymptoms.forEach(symptomKey => {
                const data = symptomDictionary[symptomKey] || { title: `Detected: "${symptomKey}"`, definition: "Spelling missing from dictionary.", recommendation: "Update code." };
                resultsList.innerHTML += `<div class="result-item"><h3 class="result-title">${data.title}</h3><p class="result-def">${data.definition}</p><p class="result-rec">Rec: ${data.recommendation}</p></div>`;
            });
        }
    }

    function showReport() {
        document.getElementById('results-list').style.display = 'block'; 
        document.getElementById('btn-view-report').style.display = 'none';    
    }

    // --- 5. IMAGE SAVING & LOCAL STORAGE LOGGING ---
    function captureSnapshot() {
        const snapCanvas = document.createElement('canvas');
        snapCanvas.width = 600; snapCanvas.height = 600; // Standardize to high-res 600x600 square
        const snapCtx = snapCanvas.getContext('2d');
        
        const minVid = Math.min(video.videoWidth, video.videoHeight);
        // NEW: Calculate the crop area based on the current zoom level!
        const cropSize = minVid / currentZoom;
        const sx = (video.videoWidth - cropSize) / 2; 
        const sy = (video.videoHeight - cropSize) / 2;
        
        // Draw the natively zoomed-in portion of the video to the 600x600 canvas
        snapCtx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, 600, 600);
        // Draw the canvas layer (which has the bounding boxes) perfectly over it
        snapCtx.drawImage(canvas, sx, sy, cropSize, cropSize, 0, 0, 600, 600);
        
        lastSnapshotURL = snapCanvas.toDataURL('image/jpeg', 0.9);
    }

    function downloadSnapshot() {
        if (!lastSnapshotURL) return;
        
        const link = document.createElement('a');
        link.href = lastSnapshotURL;
        link.download = `${currentScanID}.jpg`; 
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        const now = new Date();
        sessionHistory.push({ id: currentScanID, date: now.toLocaleDateString(), time: now.toLocaleTimeString(), symptoms: Array.from(recordedSymptoms).join(" + ") });
        localStorage.setItem('medicalScanLog', JSON.stringify(sessionHistory));
        
        setTimeout(() => resetToIdle(), 1500);
    }

    function downloadExcelLog() {
        if (sessionHistory.length === 0) {
            alert("Your log is empty! Save an image result first.");
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Scan ID,Date,Time,Symptoms Detected\n";

        sessionHistory.forEach(record => {
            csvContent += `${record.id},${record.date},${record.time},"${record.symptoms}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Medical_Log_${new Date().getTime()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function clearLogMemory() {
        if (confirm("Are you sure you want to permanently delete all saved scan logs? This cannot be undone.")) {
            sessionHistory = []; 
            localStorage.removeItem('medicalScanLog'); 
            alert("Log memory has been successfully cleared.");
        }
    }

    // --- 6. AI INITIALIZATION & INFERENCE ---
    async function initAI() {
        const debugText = document.querySelector('#state-init p');
        try {
            debugText.innerText = "Downloading AI Model...";
            classifier = new EdgeImpulseClassifier();
            if (window.wasmReady && !classifier._initialized) { if(Module.init) Module.init(); classifier._initialized = true; } 
            else { await classifier.init(); }
            modelProps = classifier.getProperties();
            offscreenCanvas.width = modelProps.input_width; offscreenCanvas.height = modelProps.input_height;
            initCamera();
        } catch (err) { panelInit.innerHTML = `<h2 style="color:red;">Error</h2><p>${err}</p>`; }
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
            video.srcObject = stream;
            video.onloadedmetadata = async () => {
                try { await video.play(); resizeCanvas(); switchState('IDLE'); requestAnimationFrame(inferenceLoop); } 
                catch (e) { panelInit.innerHTML = `<h2 style="color:red;">Playback Blocked</h2>`; }
            };
        } catch (err) { panelInit.innerHTML = `<h2 style="color:red;">Camera Denied</h2>`; }
    }

    function resizeCanvas() { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
    window.addEventListener('resize', resizeCanvas);

    function inferenceLoop() {
        if (!classifier || !modelProps) return requestAnimationFrame(inferenceLoop);

        if (currentAppState === 'SCANNING' && isLiveScanning) {
            const minVid = Math.min(video.videoWidth, video.videoHeight);
            
            // NEW: Instruct the AI to only look at the physically zoomed-in crop area!
            const cropSize = minVid / currentZoom;
            const sx = (video.videoWidth - cropSize) / 2; 
            const sy = (video.videoHeight - cropSize) / 2;
            
            offscreenCtx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, modelProps.input_width, modelProps.input_height);
            
            const imgData = offscreenCtx.getImageData(0, 0, modelProps.input_width, modelProps.input_height);
            let features = [];
            for (let i = 0; i < imgData.data.length; i += 4) features.push((imgData.data[i] << 16) | (imgData.data[i+1] << 8) | imgData.data[i+2]);

            try {
                const res = classifier.classify(features);
                let topResult = null;
                
                if (res.results && res.results.length > 0) {
                    topResult = res.results.reduce((prev, current) => (prev.value > current.value) ? prev : current);
                    if (topResult.value < 0.6) topResult = null;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (topResult) { 
                    // NEW: Calculate the box placement relative to the full canvas, compensating for the zoom crop
                    const scaleX = cropSize / modelProps.input_width; 
                    const scaleY = cropSize / modelProps.input_height;
                    const scaledX = sx + (topResult.x * scaleX); 
                    const scaledY = sy + (topResult.y * scaleY);

                    // Shrink the font and lines relative to the zoom so they don't look massive on screen
                    ctx.strokeStyle = '#00FF00'; ctx.lineWidth = Math.max(2, 4 / currentZoom);
                    ctx.strokeRect(scaledX, scaledY, topResult.width * scaleX, topResult.height * scaleY);
                    ctx.fillStyle = '#00FF00'; ctx.font = `bold ${Math.floor(24 / currentZoom)}px Arial`;
                    ctx.fillText(topResult.label, scaledX, scaledY - Math.floor(10 / currentZoom));

                    symptomFrames[topResult.label] = (symptomFrames[topResult.label] || 0) + 1;

                    if (symptomFrames[topResult.label] === CONFIRMATION_FRAMES) {
                        if (!recordedSymptoms.has(topResult.label)) {
                            recordedSymptoms.add(topResult.label);
                            captureSnapshot(); 
                            secondsSinceLastFind = 0; 
                            scanStatus.innerText = `Logged: ${topResult.label}`;
                            scanStatus.style.color = "#4CAF50"; 
                        }
                    }
                }
            } catch (e) { }
        }
        requestAnimationFrame(inferenceLoop);
    }
    setTimeout(initAI, 1000);
</script>
</body>
